<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Academy: Graphs of Linear Functions</title>
</head>
<body style="margin:0; font-family:sans-serif; background-color:#FFFDF5;">
    <div id="app"></div>

    <script>
        // Non-negotiable button styles
        const BLUE = 'background:#0D47A1; color:#FFFFFF; border:3px solid #083378; padding:10px 15px; font-size:16px; cursor:pointer; border-radius:5px; margin:5px; font-weight:bold;';
        const BLUE_DIS = 'background:#888; color:#fff; border:3px solid #666; padding:10px 15px; font-size:16px; cursor:not-allowed; border-radius:5px; margin:5px; font-weight:bold;';
        const GREY = 'background:#fff; color:#000; border:2px solid #333; padding:10px 15px; font-size:16px; cursor:pointer; border-radius:5px; margin:5px; font-weight:bold;';
        const NAV = 'background:#B8860B; color:#fff; border:2px solid #8B6508; padding:8px 12px; font-size:14px; cursor:pointer; border-radius:4px; margin:5px; font-weight:bold;';
        const NAV_DIS = 'background:#D4C890; color:#888; border:2px solid #D4C890; padding:8px 12px; font-size:14px; cursor:not-allowed; border-radius:4px; margin:5px; font-weight:bold;';

        const data = [
            {
                t: "Worked Example 1 & 2 — Equations of Lines (Pages 5-6)",
                qs: [
                    {
                        label: "Write down the gradient and y-intercept of y = -(1/2)x - 10",
                        type: "text",
                        steps: [
                            { w: ["Compare with the standard form:", "y = mx + c"], a: "m = gradient, c = y-intercept", e: "The coefficient 'm' dictates the steepness, and the constant 'c' dictates where it crosses the y-axis." },
                            { w: ["m = -1/2"], a: "Extract the gradient", e: "The gradient is negative 1/2. Because it's negative, the line will slope downwards." },
                            { w: ["c = -10"], a: "Extract the y-intercept", e: "The line crosses the vertical y-axis exactly at -10." }
                        ]
                    },
                    {
                        label: "Write the equation of the line given: gradient = 4, y-intercept = 7",
                        type: "text",
                        steps: [
                            { w: ["Use the standard form:", "y = mx + c"], a: "m = 4, c = 7", e: "Substitute the given values directly into the placeholder letters." },
                            { w: ["y = 4x + 7"], a: "Final Equation", e: "This is the complete straight-line equation." }
                        ]
                    }
                ]
            },
            {
                t: "Worked Example 3 — Drawing a Linear Graph (Page 7)",
                qs: [
                    {
                        label: "Draw the graph of y = 2x - 1 for x from 0 to 4.",
                        type: "draw_line",
                        pts: [
                            {x: 0, y: -1, l: '(0,-1)'},
                            {x: 2, y: 3, l: '(2,3)'},
                            {x: 4, y: 7, l: '(4,7)'}
                        ],
                        steps: [
                            { w: ["Construct a table of values:", "x | 0 | 2 | 4", "y | -1 | 3 | 7"], a: "Minimum 3 points needed", e: "We substitute x=0, 2, and 4 into our equation y = 2x - 1 to find the y-coordinates." },
                            { w: ["Plot point (0, -1)"], a: "x=0, y=-1", e: "This is also our y-intercept." },
                            { w: ["Plot point (2, 3)"], a: "x=2, y=3", e: "Move 2 right, 3 up." },
                            { w: ["Plot point (4, 7)"], a: "x=4, y=7", e: "Move 4 right, 7 up." },
                            { w: ["Join the points with a straight line."], a: "Draw the graph", e: "The line extends through the points representing all possible solutions." },
                            { w: ["The point (3, k) lies on the graph.", "Find the value of k."], a: "Read from graph", e: "Go to x=3, travel vertically to the line, and read across to the y-axis. k = 5." }
                        ]
                    }
                ]
            },
            {
                t: "Horizontal and Vertical Lines (Pages 8-9)",
                qs: [
                    {
                        label: "Draw the graphs of y = 3 and y = -2",
                        type: "draw_horiz",
                        lines: [{y: 3, l: 'y = 3', col: '#0D47A1'}, {y: -2, l: 'y = -2', col: '#B8860B'}],
                        steps: [
                            { w: ["Graphs of the form y = a are horizontal lines."], a: "Parallel to x-axis", e: "No matter what the x-coordinate is, the y-coordinate is always the same." },
                            { w: ["Draw y = 3"], a: "Passes through (0, 3)", e: "A completely flat line exactly 3 units above the x-axis." },
                            { w: ["Draw y = -2"], a: "Passes through (0, -2)", e: "A completely flat line exactly 2 units below the x-axis." }
                        ]
                    },
                    {
                        label: "Draw the graphs of x = 2 and x = -2",
                        type: "draw_vert",
                        lines: [{x: 2, l: 'x = 2', col: '#0D47A1'}, {x: -2, l: 'x = -2', col: '#B8860B'}],
                        steps: [
                            { w: ["Graphs of the form x = b are vertical lines."], a: "Parallel to y-axis", e: "No matter what the y-coordinate is, the x-coordinate is permanently locked." },
                            { w: ["Draw x = 2"], a: "Passes through (2, 0)", e: "A straight vertical line 2 units to the right of the y-axis." },
                            { w: ["Draw x = -2"], a: "Passes through (-2, 0)", e: "A straight vertical line 2 units to the left of the y-axis." }
                        ]
                    }
                ]
            }
        ];

        function createEl(tag, style, text) {
            let e = document.createElement(tag);
            if (style) e.setAttribute('style', style);
            if (text) e.innerHTML = text;
            return e;
        }

        let selectedEx = null;
        let currentQ = 0;
        let currentStep = 0;

        function render() {
            let app = document.getElementById('app');
            app.innerHTML = '';
            app.setAttribute('style', 'max-width:1000px; margin:0 auto; padding:20px; min-height:100vh; position:relative; padding-bottom:100px;');

            app.appendChild(createEl('div', 'position:sticky; top:0; background:#fff; border-bottom:4px solid #B8860B; padding:15px; z-index:100; box-shadow:0 2px 5px rgba(0,0,0,0.1); margin-bottom:20px; font-size:18px;', `<strong>Identity Reference:</strong> The equation of a straight line is <strong>y = mx + c</strong> (m = gradient, c = y-intercept). Horizontal lines are <strong>y = a</strong>. Vertical lines are <strong>x = b</strong>.`));

            data.forEach((ex, idx) => {
                if (selectedEx === idx) {
                    let backBtn = createEl('button', 'display:block; width:100%; text-align:left; background:#eee; border:2px solid #bbb; padding:15px; font-size:18px; font-weight:bold; cursor:pointer; margin-bottom:20px; border-radius:6px;', ex.t + ' ▲ (Click to close)');
                    backBtn.onclick = () => { selectedEx = null; render(); };
                    app.appendChild(backBtn);

                    let contentDiv = createEl('div', 'margin-bottom: 40px;', '');
                    let q = ex.qs[currentQ];
                    
                    contentDiv.appendChild(createEl('div', 'border:4px solid #B8860B; padding:20px; text-align:center; font-family:monospace; font-size:26px; font-weight:bold; background:#fff; margin-bottom:20px; border-radius:8px;', q.label));

                    if (ex.qs.length > 1) {
                        let nav = createEl('div', 'text-align:center; margin-bottom:20px;', '');
                        let prevBtn = createEl('button', currentQ > 0 ? NAV : NAV_DIS, '◀ Prev Part');
                        let nextBtn = createEl('button', currentQ < ex.qs.length - 1 ? NAV : NAV_DIS, 'Next Part ▶');
                        if (currentQ > 0) prevBtn.onclick = () => { currentQ--; currentStep=0; render(); };
                        if (currentQ < ex.qs.length - 1) nextBtn.onclick = () => { currentQ++; currentStep=0; render(); };
                        nav.appendChild(prevBtn); nav.appendChild(nextBtn); contentDiv.appendChild(nav);
                    }

                    let splitLayout = createEl('div', 'display:flex; flex-wrap:wrap; gap:20px;', '');
                    
                    let stepsDiv = createEl('div', 'flex:1; min-width:300px;', '');
                    for (let i = 0; i < currentStep; i++) {
                        let stepData = q.steps[i];
                        let stepWrap = createEl('div', 'margin-bottom:15px; border-left:5px solid #0D47A1; padding-left:15px; background:#fff; padding:10px;', '');
                        stepWrap.appendChild(createEl('div', 'font-family:monospace; font-size:19px; font-weight:bold; margin-bottom:10px;', stepData.w.join('<br>')));
                        if (stepData.a) stepWrap.appendChild(createEl('div', 'background:#FFF9C4; border:1px solid #FBC02D; padding:8px; display:inline-block; margin-bottom:5px; font-size:15px; border-radius:4px; font-weight:bold;', `💡 ${stepData.a}`));
                        if (stepData.e) stepWrap.appendChild(createEl('div', 'background:#E8F5E9; border:1px solid #4CAF50; padding:8px; display:inline-block; font-size:15px; border-radius:4px;', `💬 ${stepData.e}`));
                        stepsDiv.appendChild(stepWrap);
                    }
                    splitLayout.appendChild(stepsDiv);

                    // Render canvas only if graphical
                    if (q.type === 'draw_line' || q.type === 'draw_horiz' || q.type === 'draw_vert') {
                        let canvasContainer = createEl('div', 'flex:1; min-width:300px; text-align:center; background:#fff; border:2px solid #ccc; border-radius:8px; padding:10px;', '');
                        let canvas = document.createElement('canvas');
                        canvas.width = 400; canvas.height = 400;
                        canvas.setAttribute('style', 'max-width:100%; height:auto; background:#fafafa;');
                        canvasContainer.appendChild(canvas);
                        splitLayout.appendChild(canvasContainer);
                        
                        setTimeout(() => drawGraph(canvas, q, currentStep), 0);
                    }

                    contentDiv.appendChild(splitLayout);

                    let controlsDiv = createEl('div', 'text-align:center; margin-top:30px;', '');
                    let isDone = currentStep >= q.steps.length;
                    let stepBtn = createEl('button', isDone ? BLUE_DIS : BLUE, `Show next step (${currentStep}/${q.steps.length})`);
                    if (!isDone) stepBtn.onclick = () => { currentStep++; render(); };
                    let resetBtn = createEl('button', GREY, 'Reset');
                    resetBtn.onclick = () => { currentStep = 0; render(); };
                    
                    controlsDiv.appendChild(stepBtn); controlsDiv.appendChild(resetBtn);
                    contentDiv.appendChild(controlsDiv);
                    
                    app.appendChild(contentDiv);
                    
                } else {
                    let btn = createEl('button', 'display:block; width:100%; text-align:left; background:#fff; border:2px solid #ccc; padding:15px; font-size:18px; font-weight:bold; cursor:pointer; margin-bottom:10px; border-radius:6px;', ex.t + ' ▼');
                    btn.onclick = () => { selectedEx = idx; currentQ = 0; currentStep = 0; render(); };
                    app.appendChild(btn);
                }
            });

            app.appendChild(createEl('div', 'position:absolute; bottom:20px; width:100%; text-align:center; color:#888; font-size:13px; left:0;', `Created by Joshua Poon | Heritage Academy, Singapore<br>Chapter 6.3 — Secondary 1`));
        }

        function drawGraph(canvas, q, step) {
            let ctx = canvas.getContext('2d');
            let w = canvas.width, h = canvas.height;
            let cx = w / 2, cy = h / 2;
            let scale = 25; // Adjusted to easily fit y=7 and beyond

            ctx.clearRect(0, 0, w, h);

            // Draw Grid
            ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
            for(let i=0; i<w; i+=scale) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke();
            }

            // Draw Axes
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke(); // X
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke(); // Y
            
            ctx.fillStyle = '#000'; ctx.font = '14px Arial';
            ctx.fillText('x', w - 15, cy - 10);
            ctx.fillText('y', cx + 10, 15);
            ctx.fillText('0', cx - 15, cy + 15);

            // Axis numbering
            for(let i=-7; i<=7; i++) {
                if(i!==0 && i%2===0) { // numbering every 2 units to prevent clutter
                    ctx.fillText(i, cx + (i*scale) - 5, cy + 15); 
                    ctx.fillText(-i, cx - 20, cy + (i*scale) + 5); 
                }
            }

            if (q.type === 'draw_line') {
                // Step 2, 3, 4 draws the points
                for (let i = 0; i < step - 1 && i < q.pts.length; i++) {
                    let pt = q.pts[i];
                    let px = cx + (pt.x * scale), py = cy - (pt.y * scale);
                    ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI*2);
                    ctx.fillStyle = '#0D47A1'; ctx.fill();
                    ctx.fillStyle = '#000'; ctx.font = 'bold 16px monospace';
                    ctx.fillText(pt.l, px + 8, py - 8);
                }
                
                // Step 5 draws the line y = 2x - 1
                if (step >= 5) {
                    ctx.strokeStyle = '#083378'; ctx.lineWidth = 3;
                    ctx.beginPath();
                    // Extend line past the points: from x=-3 (y=-7) to x=5 (y=9)
                    ctx.moveTo(cx + (-3 * scale), cy - (-7 * scale));
                    ctx.lineTo(cx + (5 * scale), cy - (9 * scale));
                    ctx.stroke();
                }

                // Step 6 visualizes finding k at x=3
                if (step >= 6) {
                    let targetX = cx + (3 * scale);
                    let targetY = cy - (5 * scale);
                    
                    ctx.strokeStyle = '#e53935'; ctx.lineWidth = 3; ctx.setLineDash([5, 5]);
                    ctx.beginPath(); 
                    ctx.moveTo(targetX, cy); // Start at x-axis (3,0)
                    ctx.lineTo(targetX, targetY); // Up to line (3,5)
                    ctx.lineTo(cx, targetY); // Across to y-axis (0,5)
                    ctx.stroke();
                    ctx.setLineDash([]); 

                    ctx.beginPath(); ctx.arc(targetX, targetY, 7, 0, Math.PI*2);
                    ctx.fillStyle = '#e53935'; ctx.fill();
                    ctx.fillStyle = '#e53935'; ctx.font = 'bold 16px monospace';
                    ctx.fillText('(3, 5) ➔ k = 5', targetX + 10, targetY + 20);
                }
            } else if (q.type === 'draw_horiz') {
                if (step >= 2) {
                    let ly = cy - (q.lines[0].y * scale);
                    ctx.strokeStyle = q.lines[0].col; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(w, ly); ctx.stroke();
                    ctx.fillStyle = q.lines[0].col; ctx.font = 'bold 18px monospace';
                    ctx.fillText(q.lines[0].l, w - 70, ly - 10);
                }
                if (step >= 3) {
                    let ly = cy - (q.lines[1].y * scale);
                    ctx.strokeStyle = q.lines[1].col; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(w, ly); ctx.stroke();
                    ctx.fillStyle = q.lines[1].col; ctx.font = 'bold 18px monospace';
                    ctx.fillText(q.lines[1].l, w - 70, ly - 10);
                }
            } else if (q.type === 'draw_vert') {
                 if (step >= 2) {
                    let lx = cx + (q.lines[0].x * scale);
                    ctx.strokeStyle = q.lines[0].col; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, h); ctx.stroke();
                    ctx.fillStyle = q.lines[0].col; ctx.font = 'bold 18px monospace';
                    ctx.fillText(q.lines[0].l, lx + 10, 30);
                }
                if (step >= 3) {
                    let lx = cx + (q.lines[1].x * scale);
                    ctx.strokeStyle = q.lines[1].col; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, h); ctx.stroke();
                    ctx.fillStyle = q.lines[1].col; ctx.font = 'bold 18px monospace';
                    ctx.fillText(q.lines[1].l, lx + 10, 30);
                }
            }
        }

        render();
    </script>
</body>
</html>
