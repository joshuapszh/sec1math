<!doctype html><html lang="en"><meta charset="utf-8"><title>Heritage Maths | Developer QA</title>
<style>body{font:16px Segoe UI,Arial;max-width:900px;margin:30px auto;color:#18374f} .pass{color:#186b37}.fail{color:#b02323} li{margin:9px 0} pre{white-space:pre-wrap}</style>
<h1>Heritage Academy · Development QA</h1><p>Local browser regression checks. This page is not intended for students.</p><p id="summary">Running…</p><ol id="results"></ol>
<script src="./algebra-check.js"></script><script src="./marking.js"></script><script src="./progress.js"></script>
<script>
(async function(){
const results=document.querySelector('#results'), failures=[];
function test(name,fn){let ok=false,detail='';try{ok=!!fn();if(!ok)detail='Assertion failed'}catch(e){detail=e.message}
const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS: ':'FAIL: ')+name+(detail?' ('+detail+')':'');results.append(li);if(!ok)failures.push(name)}
const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
test('Equivalent algebra: 2(x+3) equals 2x+6',()=>HAAlgebra.check('2(x+3)','2x+6').equivalent);
test('Equivalent algebra: reordered terms',()=>HAAlgebra.check('6+2x','2x+6').equivalent);
test('Equivalent algebra: LaTeX power',()=>HAAlgebra.check('x^{2}+2x+1','(x+1)^2').equivalent);
test('Equivalent algebra: numeric LaTeX fraction',()=>HAAlgebra.check('\\frac{6}{2}x','3x').equivalent);
test('Equivalent algebra: numeric LaTeX square root',()=>HAAlgebra.check('\\sqrt{9}x','3x').equivalent);
test('Incorrect algebra rejected',()=>!HAAlgebra.check('6x+8','6x+2').equivalent);
test('Malformed expression unsupported',()=>!HAAlgebra.check('x+(','x').supported);
test('Exponent greater than two unsupported',()=>!HAAlgebra.check('x^3','x^2').supported);
test('Numeric correct',()=>HAMarking.evaluate('numeric','42',42).correct);
test('Numeric incorrect',()=>!HAMarking.evaluate('numeric','41',42).correct);
test('Blank numeric unsupported',()=>!HAMarking.evaluate('numeric','',42).supported);
const expected={points:[[0,1],[1,3],[2,5]],mode:'line',line:{m:2,c:1},tolerance:0.001};
test('Graph correct coordinates and line',()=>HAMarking.evaluate('graph',{points:[[2,5],[0,1],[1,3]],mode:'line'},expected).correct);
test('Graph detects extra point',()=>!HAMarking.evaluate('graph',{points:[[0,1],[1,3],[2,5],[3,7]],mode:'line'},expected).correct);
test('Graph detects wrong coordinate',()=>!HAMarking.evaluate('graph',{points:[[0,1],[1,3],[2,4]],mode:'line'},expected).correct);
test('Graph checks line mode',()=>!HAMarking.evaluate('graph',{points:[[0,1],[1,3],[2,5]],mode:'points'},expected).correct);
const questions=[{id:'TEST1',prompt:'Question v1',steps:[{answer:3}],stepMarks:[2]}];
const sig=[questions[0].prompt,JSON.stringify(questions[0].steps),JSON.stringify(questions[0].stepMarks)].join('|');
let supported=true;
try{HAProgress.save(questions,{TEST1:{answers:['3'],firstScore:[2],signature:sig}},[]);const out=HAProgress.load(questions);test('Progress round trip',()=>out.records.TEST1.answers[0]==='3');
const changed=[{...questions[0],prompt:'Question v2'}];const result=HAProgress.load(changed);test('Changed question not given stale marks',()=>!result.records.TEST1&&result.quarantined.length===1);
}catch(e){supported=false;test('Local storage enabled',()=>{throw e})}
try{localStorage.removeItem(HAProgress.key)}catch{}
let data;try{const resp=await fetch('./data/s1-p1-set1-draft.json');data=await resp.json()}catch(e){test('Question bank loads',()=>{throw e})}
if(data){let qs=data.questions;test('Ten distinct questions',()=>qs.length===10&&new Set(qs.map(x=>x.id)).size===10);
test('Exactly 50 marks',()=>qs.reduce((s,q)=>s+q.marks,0)===50);
test('Semester allocation 10 / 40',()=>qs.filter(q=>q.book==='1A').reduce((s,q)=>s+q.marks,0)===10&&qs.filter(q=>q.book==='1B').reduce((s,q)=>s+q.marks,0)===40);
test('Difficulty allocation 25 / 20 / 5',()=>['basic','moderate','challenging'].map(t=>qs.filter(q=>q.difficulty===t).reduce((s,q)=>s+q.marks,0)).join(',')==='25,20,5');
test('Each question has valid partial-credit totals',()=>qs.every(q=>q.steps.length===q.stepMarks.length&&q.stepMarks.reduce((a,b)=>a+b,0)===q.marks));
}
document.querySelector('#summary').textContent=failures.length?failures.length+' tests failed. Do not release.':'All checks passed in this browser. Manual and confidentiality audits still required.';
document.querySelector('#summary').className=failures.length?'fail':'pass';
})();
</script></html>
